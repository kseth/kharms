<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/ascii-road.css" | relative_url }}">
    <script src="{{ "/assets/js/ascii-road.js" | relative_url }}" defer></script>
    <link rel="icon" type="image/png" href="/assets/road.png" />
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1>
        <a href="{{ "/" | absolute_url }}" class="logo-link road-link" aria-label="kharms.ai home"><span class="ascii-road" aria-hidden="true">         .
        / \
       / . \
      /     \
     /   |   \
    /    |    \
   /           \
  /             \
 /       |       \
/        |        \</span></a>
        <a href="{{ "/" | absolute_url }}">{{ site.title }}</a>
      </h1>
      {% endif %}
      {% if page.title %}
      <h1>
        <div class="blog-title">
          {{ page.title }}
        </div>
        {% if page.description %}
        <div class="blog-description">
          {{ page.description }}
        </div>
        {% endif %}
      </h1>
      {% endif %}
      {{ content }}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
